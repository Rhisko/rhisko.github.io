<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Infrastructure Automation Delivery Pipeline | Risko</title>
    <style>
      :root {
        color-scheme: light;
        --primary-deep: #07111f;
        --primary-mid: #102c42;
        --accent: #d9a520;
        --accent-soft: #fde68a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f7f9fc;
        color: #0f172a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(18px);
      }

      a {
        color: inherit;
      }

      .brand {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .brand strong {
        font-size: 15px;
        line-height: 1.2;
      }

      .brand span {
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
      }

      .back-button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-soft), var(--accent));
        padding: 10px 16px;
        color: #0f172a;
        font-size: 13px;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 14px 30px rgba(217, 165, 32, 0.2);
      }

      main {
        width: min(100%, 1840px);
        margin: 0 auto;
        padding: 20px;
      }

      .viewer {
        overflow: auto;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 10px;
        background: white;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
      }

      img {
        display: block;
        width: 100%;
        min-width: 980px;
        height: auto;
      }

      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .back-button {
          width: 100%;
        }

        main {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>Infrastructure Automation Delivery Pipeline</strong>
        <span>Research design by Risko</span>
      </div>
      <a class="back-button" href="/#research" aria-label="Back to research section">Back to Research</a>
    </header>
    <main>
      <div class="viewer">
        <img
          src="/assets/Design/Infra_design_automation_1.png"
          alt="Infrastructure automation delivery pipeline research design"
        />
      </div>
    </main>
  </body>
</html>
